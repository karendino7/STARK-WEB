<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>خانه</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        /* نوار بالای سایت */
        header {
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }
.blue-link {
    color: blue;
}
  .menu a {
            text-decoration: none;
        }
        nav a:hover {
            color: #00aaff;
        }

        /* بخش اصلی */
        .hero {
            text-align: center;
            padding: 80px 20px 50px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #00aaff;
        }

        .hero p {
            color: #bdbdbd;
            font-size: 18px;
            max-width: 650px;
            margin: auto;
            line-height: 1.8;
        }

        /* کارت ها */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            margin: 50px 0 30px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 240px;
            padding: 30px 20px;
            background: #15151c;
            border: 1px solid #292936;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #00aaff;
        }

        .card h3 {
            font-size: 21px;
        }

        .card p {
            color: #aaa;
            line-height: 1.7;
        }

        /* فرم */
        .form-box {
            max-width: 700px;
            margin: 40px auto 80px;
            padding: 35px;
            background: #15151c;
            border: 1px solid #292936;
            border-radius: 18px;
        }

        .form-box label {
            display: block;
            margin: 15px 0 8px;
        }

        .form-box input,
        .form-box select,
        .form-box textarea {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #33333f;
            background: #0e0e13;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .form-box textarea {
            height: 130px;
            resize: vertical;
        }

        .form-box input:focus,
        .form-box select:focus,
        .form-box textarea:focus {
            border-color: #00aaff;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0088cc;
        }

        /* فوتر */
        footer {
            text-align: center;
            padding: 25px;
            background: #08080b;
            color: #888;
        }

        /* موبایل */
        @media (max-width: 600px) {

            header {
                padding: 15px 5%;
            }

            nav a {
                margin: 0 5px;
                font-size: 13px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 15px;
            }

            .card {
                width: 100%;
            }

            .form-box {
                padding: 25px 18px;
            }
        }
   h1,h2,h3  {color: rgb(0, 0, 255);
text-align: center;
}
h2 {
    color: cyan;  
}
h3 {
    color: blue;
}
p {
    color: red;
   text-align: center; 

}
        .profile-pic {
            width: 300px;
            height:300px;
            border-radius: 50%; /* گرد کردن عکس */
            object-fit: cover; /* تنظیم عکس داخل کادر */
            border: 4px solid #000000; /* فریم دور عکس */
            margin: auto;
            display: block;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
