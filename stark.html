<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK WEB ACADEMY</title>

<style>
:root {
    --bg: #0b1020;
    --panel: #121a2e;
    --gold: #ffc857;
    --blue: #66a6ff;
    --text: #eef3ff;
    --muted: #aab7d2;
    --border: #2a3856;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(ellipse at top, #182849, var(--bg) 75%);
    color: var(--text);
    font-family: Tahoma, Arial, sans-serif;
    line-height: 1.9;
}

header {
    padding: 35px 15px;
    text-align: center;
    border-bottom: 1px solid var(--border);
}

.brand {
    color: var(--gold);
    font-weight: bold;
    letter-spacing: 3px;
}

header h1 {
    font-size: clamp(25px, 5vw, 42px);
    margin: 10px 0;
}

header p {
    color: var(--muted);
}

.wrap {
    max-width: 1100px;
    margin: auto;
    padding: 20px 15px 50px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat,
.sidebar,
.lesson {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 16px;
}

.stat {
    text-align: center;
}

.stat strong {
    display: block;
    color: var(--gold);
    font-size: 23px;
}

.layout {
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
}

.sidebar {
    position: sticky;
    top: 12px;
}

.course-tab {
    width: 100%;
    padding: 10px;
    margin: 4px 0;
    text-align: right;
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
}

.course-tab:hover,
.course-tab.active {
    background: #18233b;
    border-color: var(--border);
    color: var(--gold);
}

.course-tab small {
    color: var(--muted);
}

.eyebrow {
    color: var(--blue);
    font-weight: bold;
}

.lesson h2 {
    font-size: 26px;
}

.lesson h3 {
    color: var(--gold);
    margin-top: 25px;
}

.lesson p,
.lesson li {
    color: #d4def2;
}

pre {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #070b14;
    color: #cce4ff;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font: 14px/1.8 Consolas, monospace;
}

.tip {
    background: #172b2a;
    border-right: 4px solid #58d6a3;
    border-radius: 8px;
    padding: 12px;
    margin: 18px 0;
}

.quiz {
    background: #18233b;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    margin-top: 20px;
}

.quiz label {
    display: block;
    margin: 10px 0;
    cursor: pointer;
}

.btn {
    border: 0;
    border-radius: 9px;
    padding: 10px 15px;
    margin: 5px 0;
    cursor: pointer;
    font: inherit;
    font-weight: bold;
}

.primary {
    background: var(--gold);
    color: #172033;
}

.secondary {
    background: #18233b;
    color: white;
    border: 1px solid var(--border);
}

.progress-track {
    height: 8px;
    background: #26344f;
    border-radius: 10px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-fill {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--blue), #58d6a3);
    transition: width .3s;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

.result {
    font-weight: bold;
    margin-top: 10px;
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 25px;
}

@media (max-width: 760px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        position: static;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    #lessonNav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
    }

    .lesson h2 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">STARK WEB ACADEMY</div>
    <h1>از اولین تگ تا سایت تعاملی</h1>
    <p>
        آموزش قدم‌به‌قدم HTML، CSS و JavaScript
    </p>
</header>

<main class="wrap">

    <div class="stats">
        <div class="stat">
            <strong>۳</strong>
            زبان اصلی وب
        </div>

        <div class="stat">
            <strong id="lessonCount">۲۴</strong>
            درس آموزشی
        </div>

        <div class="stat">
            <strong id="progressText">۰٪</strong>
            پیشرفت دوره
        </div>
    </div>

    <div class="layout">

        <aside class="sidebar">
            <h3>فهرست دوره</h3>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <nav id="lessonNav"></nav>
        </aside>

        <section class="lesson" id="lessonContent"></section>

    </div>

</main>

<footer>
    ساخته‌شده برای یادگیری طراحی سایت با STARK WEB
</footer>

{
course: "JavaScript",
title: "توابع و رویدادها",
desc: "تابع برای اجرای دوباره یک مجموعه دستور و رویداد برای واکنش به کاربر است.",

explain: [

const nav = document.getElementById("lessonNav");
const content = document.getElementById("lessonContent");
const done = new Set();

lessons.forEach((lesson, index) => {
    const button = document.createElement("button");

    button.className = "course-tab";
    button.dataset.index = index;
    button.textContent = `${index + 1}. ${lesson.title}`;

    button.addEventListener("click", () => render(index));

    nav.appendChild(button);
});

function updateProgress() {
    const percent = Math.round(done.size / lessons.length * 100);

    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("progressText").textContent = percent + "٪";
    document.getElementById("lessonCount").textContent = lessons.length;

    document.querySelectorAll(".course-tab").forEach(button => {
        const index = Number(button.dataset.index);

        if (done.has(index)) {
            button.textContent = "✓ " + (index + 1) + ". " + lessons[index].title;
        } else {
            button.textContent = (index + 1) + ". " + lessons[index].title;
        }
    });
}

function render(index) {
    const lesson = lessons[index];

    document.querySelectorAll(".course-tab").forEach(button => {
        button.classList.toggle(
            "active",
            Number(button.dataset.index) === index
        );
    });

    content.innerHTML = `
        <div class="eyebrow">
            ${lesson.course} | درس ${index + 1} از ${lessons.length}
        </div>

        <h2>${lesson.title}</h2>
        <p>${lesson.desc}</p>

        <h3>نمونه کد</h3>
        <pre><code></code></pre>

        <h3>نکته‌های درس</h3>
        <ul>
            ${lesson.explain.map(item => `<li>${item}</li>`).join("")}
        </ul>

        <div class="tip">
            تمرین: کد را در VS Code بنویس و نتیجه را بررسی کن.
        </div>

        <div class="quiz">
            <strong>آزمون کوتاه</strong>
            <p>${lesson.q}</p>

            ${lesson.opts.map((option, i) => `
                <label>
                    <input type="radio" name="answer" value="${i}">
                    ${option}
                </label>
            `).join("")}

            <button class="btn secondary" id="check">
                بررسی پاسخ
            </button>

            <div class="result" id="result"></div>
        </div>

        <div class="actions">
            <button class="btn primary" id="complete">
                تکمیل درس
            </button>

            <button class="btn secondary" id="prev"
                ${index === 0 ? "disabled" : ""}>
                درس قبلی
            </button>

            <button class="btn secondary" id="next"
                ${index === lessons.length - 1 ? "disabled" : ""}>
                درس بعدی
            </button>
        </div>
    `;

    content.querySelector("pre code").textContent = lesson.code;

    content.querySelector("#check").addEventListener("click", () => {
        const selected = content.querySelector(
            'input[name="answer"]:checked'
        );

        const result = content.querySelector("#result");

        if (!selected) {
            result.textContent = "اول یک پاسخ انتخاب کن.";
            result.style.color = "var(--gold)";
            return;
        }

        if (Number(selected.value) === lesson.correct) {
            result.textContent = "آفرین! پاسخ درست است.";
            result.style.color = "#58d6a3";

            done.add(index);
            updateProgress();
        } else {
            result.textContent = "پاسخ درست نیست؛ دوباره تلاش کن.";
            result.style.color = "#ff9292";
        }
    });

    content.querySelector("#complete").addEventListener("click", () => {
        done.add(index);
        updateProgress();
        render(index);
    });

    content.querySelector("#prev").addEventListener("click", () => {
        if (index > 0) render(index - 1);
    });

    content.querySelector("#next").addEventListener("click", () => {
        if (index < lessons.length - 1) render(index + 1);
    });

    updateProgress();
}

render(0);
</script>
